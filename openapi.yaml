openapi: 3.1.0
info:
  title: Moxie Public API
  description: "Public API for reading and writing Moxie workspace data - clients,\
    \ contacts, projects, invoices, payments, agreements, tickets, time tracking and\
    \ more. All requests authenticate with the X-API-KEY header."
  version: v1
servers:
- url: https://api.withmoxie.com
  description: Generated server url
security:
- apiKey: []
paths:
  /public/action/projects/update:
    put:
      tags:
      - Projects & Tasks
      summary: Update project (full replace)
      description: Replaces the project identified by id with the request body. Omitted
        fields are overwritten.
      operationId: updateProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Project"
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No project with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
    patch:
      tags:
      - Projects & Tasks
      summary: Update project (partial)
      description: Merges the given fields into the project identified by id.
      operationId: patchProject
      requestBody:
        description: "Any subset of the entity fields to change, plus the required\
          \ id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No project with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/opportunities/update:
    put:
      tags:
      - Pipeline & Forms
      summary: Update opportunity (full replace)
      description: Replaces the opportunity identified by id with the request body.
        Omitted fields are overwritten.
      operationId: updateOpportunity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Opportunity"
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No opportunity with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
    patch:
      tags:
      - Pipeline & Forms
      summary: Update opportunity (partial)
      description: Merges the given fields into the opportunity identified by id.
        Moving pipeline stage is a patch of statusId.
      operationId: patchOpportunity
      requestBody:
        description: "Any subset of the entity fields to change, plus the required\
          \ id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No opportunity with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/expenses/update:
    put:
      tags:
      - Expenses
      summary: Update expense (full replace)
      description: Replaces the expense identified by id with the request body. Omitted
        fields are overwritten.
      operationId: updateExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Expense"
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No expense with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
    patch:
      tags:
      - Expenses
      summary: Update expense (partial)
      description: Merges the given fields into the expense identified by id.
      operationId: patchExpense
      requestBody:
        description: "Any subset of the entity fields to change, plus the required\
          \ id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No expense with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/contacts/update:
    put:
      tags:
      - Contacts
      summary: Update contact (full replace)
      description: Replaces the contact identified by id with the request body. Omitted
        fields are overwritten.
      operationId: updateContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Contact"
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No contact with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
    patch:
      tags:
      - Contacts
      summary: Update contact (partial)
      description: Merges the given fields into the contact identified by id.
      operationId: patchContact
      requestBody:
        description: "Any subset of the entity fields to change, plus the required\
          \ id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No contact with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/clients/update:
    put:
      tags:
      - Clients
      summary: Update client (full replace)
      description: Replaces the client identified by id with the request body. Omitted
        fields are overwritten. accountId is always forced to the caller's workspace.
      operationId: updateClient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Client"
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No client with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
    patch:
      tags:
      - Clients
      summary: Update client (partial)
      description: Merges the given fields into the client identified by id. Omitted
        fields keep their current values.
      operationId: patchClient
      requestBody:
        description: "Any subset of the entity fields to change, plus the required\
          \ id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No client with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/unsubscribe:
    get:
      tags:
      - public-unsubscribe-controller
      operationId: confirm
      parameters:
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - public-unsubscribe-controller
      operationId: unsubscribe
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /public/api/unsubscribe:
    post:
      tags:
      - api-hook-controller
      operationId: unsubscribeHook
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestHook"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /public/api/subscribe:
    post:
      tags:
      - api-hook-controller
      operationId: subscribeHook
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestHook"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /public/api/sample:
    post:
      tags:
      - api-hook-controller
      operationId: getSampleData
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestHook"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {}
  /public/action/timeWorked/create:
    post:
      tags:
      - Time Tracking
      summary: Create time entry
      description: "Logs a time-worked entry; can create the client, project or deliverable\
        \ on the fly via the create* flags."
      operationId: createTimerEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimerCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerEvent"
  /public/action/tickets/create:
    post:
      tags:
      - Tickets
      summary: Create ticket
      operationId: createTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWrapper"
  /public/action/tickets/comments/create:
    post:
      tags:
      - Tickets
      summary: Add comment to ticket
      operationId: createTicketComment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCommentCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWrapper"
  /public/action/tasks/create:
    post:
      tags:
      - Projects & Tasks
      summary: Create task
      description: "Creates a task (deliverable) inside a project, resolved by client\
        \ and project name."
      operationId: creteTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeliverable"
  /public/action/projects/create:
    post:
      tags:
      - Projects & Tasks
      summary: Create project
      operationId: crateProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /public/action/payment/create:
    post:
      tags:
      - Invoices & Payments
      summary: Apply payment to invoice
      description: Applies a payment to an open invoice matched by invoiceNumber and
        clientName.
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
        required: true
      responses:
        "404":
          description: "Invoice, client or contact could not be located"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/opportunities/create:
    post:
      tags:
      - Pipeline & Forms
      summary: Create opportunity
      operationId: createOpportunity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /public/action/invoices/create:
    post:
      tags:
      - Invoices & Payments
      summary: Create invoice
      description: Creates and optionally sends an invoice with line items. When sendTo.send
        is false or omitted the invoice stays in DRAFT.
      operationId: createInvoice_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
        required: true
      responses:
        "404":
          description: "Client, email template or send contacts could not be located"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/formSubmissions/create:
    post:
      tags:
      - Pipeline & Forms
      summary: Create form submission
      description: "Submits a lead or discovery form by name, creating a pipeline\
        \ entry."
      operationId: crateFormSubmission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormSubmissionCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmission"
  /public/action/expenses/create:
    post:
      tags:
      - Expenses
      summary: Create expense
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /public/action/deliverable/approve:
    post:
      tags:
      - Projects & Tasks
      summary: Approve deliverable
      description: "Approves a project deliverable identified by client, project and\
        \ deliverable name."
      operationId: createTimerEvent_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDeliverable"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeliverableMini"
  /public/action/contacts/create:
    post:
      tags:
      - Contacts
      summary: Create contact
      operationId: createContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /public/action/clients/create:
    post:
      tags:
      - Clients
      summary: Create client
      operationId: searchClients
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Client"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /public/action/calendar/createOrUpdate:
    post:
      tags:
      - Calendar
      summary: Create or update calendar event
      description: "Creates a calendar event, or updates it when eventId is supplied."
      operationId: createOrUpdateCalendarEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEvent"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeCalendarEvent"
  /public/action/attachments/create:
    post:
      tags:
      - Attachments
      summary: Attach file (multipart upload)
      description: Uploads a file (multipart/form-data) and attaches it to a record.
      operationId: uploadAttachment
      parameters:
      - name: id
        in: query
        description: Id of the object to attach the file to
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: "CLIENT, PROJECT, DELIVERABLE, OPPORTUNITY, EXPENSE or TICKET"
        required: true
        schema:
          type: string
          enum:
          - CLIENT
          - PROJECT
          - DELIVERABLE
          - OPPORTUNITY
          - EXPENSE
          - TICKET
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /public/action/attachments/createFromUrl:
    post:
      tags:
      - Attachments
      summary: Attach file from URL
      description: Fetches a file from a public URL and attaches it to a record.
      operationId: uploadAttachment_1
      parameters:
      - name: id
        in: query
        description: Id of the object to attach the file to
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: "CLIENT, PROJECT, DELIVERABLE, OPPORTUNITY, EXPENSE or TICKET"
        required: true
        schema:
          type: string
          enum:
          - CLIENT
          - PROJECT
          - DELIVERABLE
          - OPPORTUNITY
          - EXPENSE
          - TICKET
      - name: fileUrl
        in: query
        description: Publicly reachable URL of the file to fetch
        required: true
        schema:
          type: string
      - name: fileName
        in: query
        description: Name to store the file under
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
  /public/action/tickets/status:
    patch:
      tags:
      - Tickets
      summary: Update ticket status
      description: Changes only the workflow status of the ticket identified by id
        or number.
      operationId: updateTicketStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketStatusUpdate"
        required: true
      responses:
        "200":
          description: Ticket status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "412":
          description: "The identifier or status is missing, or the status is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No ticket with that id or number exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/tasks/update:
    patch:
      tags:
      - Projects & Tasks
      summary: Update task (partial)
      description: Merges the given fields into the task identified by id.
      operationId: patchTask
      requestBody:
        description: "Any subset of task fields to change, plus the required id"
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeliverable"
        "412":
          description: The id field is missing from the request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
        "404":
          description: No task with that id exists in the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/api/customFields:
    get:
      tags:
      - api-hook-controller
      operationId: getCustomFields
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: type
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DynamicField"
  /public/api/auth:
    get:
      tags:
      - api-hook-controller
      operationId: validateZapierAuth
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleAccount"
  /public/action/vendors/list:
    get:
      tags:
      - Workspace & Reference Data
      summary: List vendor names
      operationId: getVendorNames
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /public/action/users/list:
    get:
      tags:
      - Workspace & Reference Data
      summary: List workspace users
      operationId: getPayableInvoices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccountMini"
                uniqueItems: true
  /public/action/tickets/search:
    get:
      tags:
      - Tickets
      summary: Search tickets
      description: "Case-insensitive matching on ticket subject, status, summary,\
        \ and number. Pass id or ticketNumber for an exact lookup."
      operationId: searchTickets
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact ticket id; overrides ticketNumber and query
        required: false
        schema:
          type: string
      - name: ticketNumber
        in: query
        description: Exact ticket number; overrides query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /public/action/tickets/list:
    get:
      tags:
      - Tickets
      summary: List tickets
      description: "Lists tickets, optionally filtered by client, open state, or archive\
        \ state."
      operationId: listTickets
      parameters:
      - name: open
        in: query
        required: false
        schema:
          type: boolean
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: clientId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /public/action/tasks/search:
    get:
      tags:
      - Projects & Tasks
      summary: Search tasks
      description: Case-insensitive matching on task name and description. Pass id
        for an exact lookup.
      operationId: searchTasks
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact task id; overrides query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectDeliverableMini"
  /public/action/tasks/list:
    get:
      tags:
      - Projects & Tasks
      summary: List tasks
      description: "Lists tasks, optionally filtered by project, client, status, or\
        \ archive state."
      operationId: listTasks
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: string
      - name: clientId
        in: query
        required: false
        schema:
          type: string
      - name: statusId
        in: query
        required: false
        schema:
          type: string
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectDeliverableMini"
  /public/action/taskStages/list:
    get:
      tags:
      - Workspace & Reference Data
      summary: List project task stages
      description: "Lists task stages for the requested project type, or for the default\
        \ project type when projectTypeId is omitted."
      operationId: getTaskStages
      parameters:
      - name: projectTypeId
        in: query
        description: Project type id returned by List project types
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliverableStatus"
  /public/action/projects/search:
    get:
      tags:
      - Projects & Tasks
      summary: Search projects
      description: query is an exact client name and returns that client's projects
        (404 if no such client). Pass id for an exact single-record lookup. Omit both
        to list all projects.
      operationId: searchProjects
      parameters:
      - name: query
        in: query
        description: Exact client name; returns that client's projects
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact project id; overrides query
        required: false
        schema:
          type: string
      responses:
        "404":
          description: query was given but no client with that exact name exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/projectTypes/list:
    get:
      tags:
      - Workspace & Reference Data
      summary: List project types
      description: "Lists the workspace's project types, including their project fields,\
        \ task fields, and task stages."
      operationId: getProjectTypes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectType"
  /public/action/pipelineStages/list:
    get:
      tags:
      - Workspace & Reference Data
