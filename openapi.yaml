openapi: 3.1.0
info:
  title: Moxie CRM Public API
  description: |
    The Moxie CRM Public API allows you to programmatically interact with your Moxie workspace.
    This API enables management of clients, contacts, projects, invoices, time entries, expenses,
    opportunities, tickets, and more.

    ## Authentication
    All API requests require authentication using an API key passed in the `X-API-KEY` header.

    ## Rate Limiting
    The API is rate limited to 100 requests per 5 minutes per workspace.

    ## Base URL
    The base URL is workspace-specific and follows the pattern:
    `https://{pod}.withmoxie.com/api/public`

    Where `{pod}` is your workspace's pod identifier (e.g., pod01, pod02).
  version: 1.0.0
  contact:
    name: Moxie Support
    url: https://help.withmoxie.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{pod}.withmoxie.com/api/public
    description: Moxie CRM Production API
    variables:
      pod:
        default: pod01
        description: Your workspace's pod identifier

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Your Moxie API key

  schemas:
    # ==========================================
    # Common Types
    # ==========================================

    PaymentTerms:
      type: object
      properties:
        paymentDays:
          type: integer
          description: Number of days for payment terms
          example: 30
        latePaymentFee:
          type: number
          description: Late payment fee percentage
          example: 1.5
        hourlyAmount:
          type: number
          description: Default hourly rate
          example: 150.00
        whoPaysCardFees:
          type: string
          enum: [Client, Freelancer, Split]
          description: Who pays credit card processing fees
          example: Client

    # ==========================================
    # Client Schemas
    # ==========================================

    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique contact identifier
        accountId:
          type: string
          format: uuid
          description: Account identifier
        clientId:
          type: string
          format: uuid
          description: Associated client identifier
        firstName:
          type: string
          description: Contact's first name
          example: John
        lastName:
          type: string
          description: Contact's last name
          example: Doe
        role:
          type: string
          description: Contact's role/title
          example: Marketing Director
        phone:
          type: string
          description: Phone number
          example: "+1-555-123-4567"
        email:
          type: string
          format: email
          description: Email address
          example: john.doe@example.com
        mobile:
          type: string
          description: Mobile phone number
        notes:
          type: string
          description: Additional notes
        defaultContact:
          type: boolean
          description: Whether this is the default contact
          default: false
        invoiceContact:
          type: boolean
          description: Whether this contact receives invoices
          default: false
        portalAccess:
          type: boolean
          description: Whether this contact has portal access
          default: false

    Client:
      type: object
      required:
        - name
        - clientType
        - currency
      properties:
        id:
          type: string
          format: uuid
          description: Unique client identifier
        accountId:
          type: string
          format: uuid
          description: Account identifier
        name:
          type: string
          description: Client name
          example: Acme Corporation
        clientType:
          type: string
          enum: [Client, Prospect]
          description: Type of client
          example: Client
        initials:
          type: string
          description: Client initials for display
          maxLength: 3
          example: ACM
        address1:
          type: string
          description: Primary address line
        address2:
          type: string
          description: Secondary address line
        city:
          type: string
          description: City
        locality:
          type: string
          description: State/Province
        postal:
          type: string
          description: Postal/ZIP code
        country:
          type: string
          description: Country
        website:
          type: string
          format: uri
          description: Client website
        phone:
          type: string
          description: Phone number
        color:
          type: string
          description: Display color (hex)
          example: "#FF5733"
        taxId:
          type: string
          description: Tax identification number
        leadSource:
          type: string
          description: How the client was acquired
        archive:
          type: boolean
          description: Whether the client is archived
          default: false
        paymentTerms:
          $ref: '#/components/schemas/PaymentTerms'
        payInstructions:
          type: string
          description: Payment instructions for invoices
        hourlyAmount:
          type: number
          description: Default hourly rate
        roundingIncrement:
          type: integer
          description: Time rounding increment in minutes
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: USD
        stripeClientId:
          type: string
          description: Stripe customer ID
        notes:
          type: string
          description: Internal notes
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
          description: Associated contacts
        logo:
          type: string
          format: uri
          description: Client logo URL

    CreateClientInput:
      type: object
      required:
        - name
        - clientType
        - currency
      properties:
        name:
          type: string
          description: Client name
          example: Acme Corporation
        clientType:
          type: string
          enum: [Client, Prospect]
          description: Type of client
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: USD
        initials:
          type: string
          maxLength: 3
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        locality:
          type: string
        postal:
          type: string
        country:
          type: string
        website:
          type: string
          format: uri
        phone:
          type: string
        color:
          type: string
        taxId:
          type: string
        leadSource:
          type: string
        archive:
          type: boolean
        paymentTerms:
          $ref: '#/components/schemas/PaymentTerms'
        payInstructions:
          type: string
        hourlyAmount:
          type: number
        roundingIncrement:
          type: integer
        stripeClientId:
          type: string
        notes:
          type: string
        contacts:
          type: array
          items:
            type: object
            properties:
              firstName:
                type: string
              lastName:
                type: string
              role:
                type: string
              phone:
                type: string
              email:
                type: string
                format: email
              mobile:
                type: string
              notes:
                type: string
              defaultContact:
                type: boolean
              invoiceContact:
                type: boolean
              portalAccess:
                type: boolean

    CreateContactInput:
      type: object
      required:
        - clientName
      properties:
        clientName:
          type: string
          description: Name of the client to add contact to
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        notes:
          type: string
        defaultContact:
          type: boolean
        invoiceContact:
          type: boolean
        portalAccess:
          type: boolean

    # ==========================================
    # Project Schemas
    # ==========================================

    FeeSchedule:
      type: object
      properties:
        feeType:
          type: string
          enum: [HOURLY, FIXED, RETAINER]
          description: Type of fee structure
        amount:
          type: number
          description: Fee amount
        retainerSchedule:
          type: string
          description: Retainer billing schedule
        estimateMax:
          type: number
          description: Maximum estimate
        estimateMin:
          type: number
          description: Minimum estimate
        retainerStart:
          type: string
          format: date
          description: Retainer start date
        retainerTiming:
          type: string
          description: When retainer is billed
        retainerOverageRate:
          type: number
          description: Rate for hours over retainer
        taxable:
          type: boolean
          description: Whether the fee is taxable

    Project:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        name:
          type: string
          description: Project name
          example: Website Redesign
        description:
          type: string
          description: Project description
        active:
          type: boolean
          description: Whether the project is active
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        dateCreated:
          type: string
          format: date-time
        client:
          $ref: '#/components/schemas/Client'
        feeSchedule:
          $ref: '#/components/schemas/FeeSchedule'
        proposalId:
          type: string
          format: uuid
        proposalName:
          type: string
        hexColor:
          type: string
          description: Display color
          example: "#3498db"
        portalAccess:
          type: string
          description: Portal access level
        showTimeWorkedInPortal:
          type: boolean

    CreateProjectInput:
      type: object
      required:
        - clientName
        - name
      properties:
        clientName:
          type: string
          description: Name of the client (must exist)
        name:
          type: string
          description: Project name
        description:
          type: string
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        feeSchedule:
          $ref: '#/components/schemas/FeeSchedule'
        hexColor:
          type: string
        portalAccess:
          type: string

    ProjectTaskStage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Stage name
          example: In Progress
        order:
          type: integer
          description: Display order

    # ==========================================
    # Invoice Schemas
    # ==========================================

    InvoiceItem:
      type: object
      properties:
        description:
          type: string
          description: Line item description
        quantity:
          type: number
          description: Quantity
        rate:
          type: number
          description: Unit rate
        taxable:
          type: boolean
          description: Whether this item is taxable
        projectName:
          type: string
          description: Associated project name

    InvoiceSendTo:
      type: object
      properties:
        send:
          type: boolean
          description: Whether to send the invoice
        contacts:
          type: array
          items:
            type: string
          description: Email addresses to send to
        emailTemplateName:
          type: string
          description: Name of email template to use

    Invoice:
      type: object
      required:
        - clientName
        - items
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
          description: Invoice number
          example: INV-2024-001
        clientName:
          type: string
          description: Client name
        templateName:
          type: string
          description: Invoice template name
        dueDate:
          type: string
          format: date
        taxRate:
          type: number
          description: Tax rate percentage
        discountPercent:
          type: number
          description: Discount percentage
        paymentInstructions:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        sendTo:
          $ref: '#/components/schemas/InvoiceSendTo'
        status:
          type: string
          description: Invoice status
          example: draft
        total:
          type: number
          description: Total amount
        amountDue:
          type: number
          description: Amount still due

    CreateInvoiceInput:
      type: object
      required:
        - clientName
        - items
      properties:
        clientName:
          type: string
          description: Client name (must exist)
        invoiceNumber:
          type: string
        templateName:
          type: string
        dueDate:
          type: string
          format: date
        taxRate:
          type: number
        discountPercent:
          type: number
        paymentInstructions:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        sendTo:
          $ref: '#/components/schemas/InvoiceSendTo'

    ApplyPaymentInput:
      type: object
      required:
        - invoiceId
        - amount
      properties:
        invoiceId:
          type: string
          format: uuid
          description: Invoice ID to apply payment to
        amount:
          type: number
          description: Payment amount
        paymentDate:
          type: string
          format: date
        paymentMethod:
          type: string
          description: Payment method used
          example: Bank Transfer
        notes:
          type: string
          description: Payment notes

    # ==========================================
    # Task Schemas
    # ==========================================

    Task:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Task name
        description:
          type: string
        projectName:
          type: string
        clientName:
          type: string
        assignedTo:
          type: array
          items:
            type: string
            format: email
          description: Email addresses of assigned users
        dueDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
          description: Task start date
        status:
          type: string
        priority:
          type: integer
          description: Numeric priority for sorting in kanban
        tasks:
          type: array
          items:
            type: string
          description: Array of subtask names
        customValues:
          type: object
          additionalProperties:
            type: string
          description: Map of custom field names to values

    CreateTaskInput:
      type: object
      required:
        - name
        - projectName
      properties:
        name:
          type: string
          description: Task name
        description:
          type: string
        projectName:
          type: string
          description: Project name (must exist, exact match)
        clientName:
          type: string
          description: Client name (must exist, exact match)
        assignedTo:
          type: array
          items:
            type: string
            format: email
          description: Email addresses of users in the workspace
        dueDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        status:
          type: string
          description: Must match exactly a status in your kanban
        priority:
          type: integer
          description: Numeric priority for sorting in kanban
        tasks:
          type: array
          items:
            type: string
          description: Array of subtask names to create
        customValues:
          type: object
          additionalProperties:
            type: string
          description: Map of custom field names to values (keys must match project settings)


    # ==========================================
    # Time Entry Schemas
    # ==========================================

    TimeEntry:
      type: object
      required:
        - timerStart
        - timerEnd
        - userEmail
      properties:
        id:
          type: string
          format: uuid
        timerStart:
          type: string
          format: date-time
          description: Start time (ISO 8601)
        timerEnd:
          type: string
          format: date-time
          description: End time (ISO 8601)
        clientName:
          type: string
        projectName:
          type: string
        deliverableName:
          type: string
        userEmail:
          type: string
          format: email
          description: Email of user who worked
        notes:
          type: string
        duration:
          type: integer
          description: Duration in minutes

    CreateTimeEntryInput:
      type: object
      required:
        - timerStart
        - timerEnd
        - userEmail
      properties:
        timerStart:
          type: string
          format: date-time
          description: Start time (ISO 8601)
        timerEnd:
          type: string
          format: date-time
          description: End time (ISO 8601)
        userEmail:
          type: string
          format: email
        clientName:
          type: string
        projectName:
          type: string
        deliverableName:
          type: string
        createClient:
          type: boolean
          description: Auto-create client if not exists
          default: false
        createProject:
          type: boolean
          description: Auto-create project if not exists
          default: false
        createDeliverable:
          type: boolean
          description: Auto-create deliverable if not exists
          default: false
        notes:
          type: string

    # ==========================================
    # Expense Schemas
    # ==========================================

    Expense:
      type: object
      required:
        - description
        - amount
        - date
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date
        vendorName:
          type: string
        clientName:
          type: string
        projectName:
          type: string
        category:
          type: string
        billable:
          type: boolean
          default: false
        reimbursable:
          type: boolean
          default: false

    CreateExpenseInput:
      type: object
      required:
        - description
        - amount
        - date
      properties:
        description:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date
        vendorName:
          type: string
        clientName:
          type: string
        projectName:
          type: string
        category:
          type: string
        billable:
          type: boolean
        reimbursable:
          type: boolean

    # ==========================================
    # Opportunity Schemas
    # ==========================================

    Opportunity:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Opportunity name
        clientName:
          type: string
        contactName:
          type: string
        stage:
          type: string
          description: Pipeline stage name
        value:
          type: number
          description: Estimated value
        probability:
          type: number
          description: Win probability (0-100)
          minimum: 0
          maximum: 100
        expectedCloseDate:
          type: string
          format: date
        description:
          type: string

    CreateOpportunityInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        clientName:
          type: string
        contactName:
          type: string
        stage:
          type: string
        value:
          type: number
        probability:
          type: number
        expectedCloseDate:
          type: string
          format: date
        description:
          type: string

    PipelineStage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        order:
          type: integer

    # ==========================================
    # Ticket Schemas
    # ==========================================

    TicketFormAnswer:
      type: object
      required:
        - fieldKey
        - question
        - answer
      properties:
        fieldKey:
          type: string
          description: Property key for reporting and token mapping
        question:
          type: string
          description: The question text associated with this answer
        answer:
          type: string
          description: The answer provided

    Ticket:
      type: object
      required:
        - userEmail
        - ticketType
        - comment
      properties:
        id:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
          description: Email of a known contact in the workspace
        ticketType:
          type: string
          description: Ticket type (must match a type in Tickets >> Settings)
        subject:
          type: string
          description: Ticket subject/title
        comment:
          type: string
          description: Initial details/comment of the ticket
        dueDate:
          type: string
          format: date
          description: Due date in ISO format
        formData:
          type: object
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/TicketFormAnswer'
          description: Structured questions/answers mapped to ticket data

    CreateTicketInput:
      type: object
      required:
        - userEmail
        - ticketType
        - comment
      properties:
        userEmail:
          type: string
          format: email
          description: Email of a known contact (ticket rejected if not found)
        ticketType:
          type: string
          description: Ticket type (found in Tickets >> Settings)
        comment:
          type: string
          description: Initial details/comment of the ticket
        subject:
          type: string
          description: Ticket subject/title
        dueDate:
          type: string
          format: date
          description: Due date in ISO format
        formData:
          type: object
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/TicketFormAnswer'
          description: Additional structured questions/answers

    TicketComment:
      type: object
      required:
        - ticketId
        - content
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        content:
          type: string
        authorEmail:
          type: string
          format: email

    CreateTicketCommentInput:
      type: object
      required:
        - ticketId
        - content
      properties:
        ticketId:
          type: string
          format: uuid
        content:
          type: string
        authorEmail:
          type: string
          format: email

    # ==========================================
    # Form Schemas
    # ==========================================

    FormName:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    FormAnswer:
      type: object
      required:
        - fieldKey
        - question
        - answer
      properties:
        fieldKey:
          type: string
          description: Property key for reporting and token mapping
        question:
          type: string
          description: The question text associated with this answer
        answer:
          type: string
          description: The answer provided

    CreateFormSubmissionInput:
      type: object
      properties:
        formName:
          type: string
          description: Associate with an existing form template for reporting
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
        businessName:
          type: string
        website:
          type: string
          format: uri
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        locality:
          type: string
        postal:
          type: string
        country:
          type: string
        sourceUrl:
          type: string
          format: uri
          description: URL where the form was submitted
        leadSource:
          type: string
        notes:
          type: string
        pipelineStageName:
          type: string
          description: Creates an Opportunity in pipeline (must match stage name exactly)
        answers:
          type: array
          items:
            $ref: '#/components/schemas/FormAnswer'
          description: Structured question/answer objects

    # ==========================================
    # File Schemas
    # ==========================================

    AttachFileFromUrlInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: URL of the file to attach
        fileName:
          type: string
          description: Override filename
        clientName:
          type: string
        projectName:
          type: string
        entityType:
          type: string
          description: Type of entity to attach to
        entityId:
          type: string
          format: uuid
          description: ID of entity to attach to

    # ==========================================
    # Calendar Schemas
    # ==========================================

    CalendarEvent:
      type: object
      required:
        - title
        - startTime
        - endTime
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        location:
          type: string
        clientName:
          type: string
        projectName:
          type: string
        attendees:
          type: array
          items:
            type: string
            format: email

    CreateCalendarEventInput:
      type: object
      required:
        - title
        - startTime
        - endTime
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        location:
          type: string
        clientName:
          type: string
        projectName:
          type: string
        attendees:
          type: array
          items:
            type: string
            format: email

    UpdateCalendarEventInput:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        location:
          type: string
        clientName:
          type: string
        projectName:
          type: string
        attendees:
          type: array
          items:
            type: string
            format: email

    DeleteCalendarEventInput:
      type: object
      required:
        - eventId
      properties:
        eventId:
          type: string
          format: uuid

    # ==========================================
    # Deliverable Schemas
    # ==========================================

    ApproveDeliverableInput:
      type: object
      required:
        - deliverableId
      properties:
        deliverableId:
          type: string
          format: uuid
        projectName:
          type: string
        clientName:
          type: string

    # ==========================================
    # Template & Reference Schemas
    # ==========================================

    EmailTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subject:
          type: string
        body:
          type: string

    InvoiceTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    VendorName:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    WorkspaceUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string

    # ==========================================
    # Error Schema
    # ==========================================

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          additionalProperties: true

  responses:
    UnauthorizedError:
      description: API key is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            code: "UNAUTHORIZED"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitError:
      description: Rate limit exceeded (100 requests per 5 minutes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Rate limit exceeded"
            code: "RATE_LIMIT_EXCEEDED"

