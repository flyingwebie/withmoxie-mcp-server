  /action/formSubmissions/create:
    post:
      tags:
        - Forms
      summary: Create form submission
      description: |
        Creates a new form submission with lead information and custom answers.
        Can optionally create a pipeline opportunity by providing pipelineStageName.
      operationId: createFormSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormSubmissionInput'
      responses:
        '200':
          description: Form submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  submissionId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

