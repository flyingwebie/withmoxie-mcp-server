  # ==========================================

  /action/files/attach:
    post:
      tags:
        - Files
      summary: Attach file (multipart)
      description: Uploads and attaches a file using multipart form data
      operationId: attachFileMultipart
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                clientName:
                  type: string
                projectName:
                  type: string
                entityType:
                  type: string
                entityId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: File attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fileId:
                    type: string
                    format: uuid
                  fileName:
                    type: string
