      operationId: getPipelineStages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"
  /public/action/payableInvoices/search:
    get:
      tags:
      - Invoices & Payments
      summary: Search payable invoices
      description: Lists outstanding invoices including line items. query is an exact
        client name (empty array if no such client). Pass id for an exact single-record
        lookup.
      operationId: getPayableInvoices_1
      parameters:
      - name: query
        in: query
        description: Exact client name; returns that client's outstanding invoices
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact invoice id; overrides query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceMini"
  /public/action/invoiceTemplates/list:
    get:
