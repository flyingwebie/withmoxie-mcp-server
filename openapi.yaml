              schema:
                type: array
                items:
                  type: string
  /public/action/emailTemplates:
    get:
      tags:
      - Workspace & Reference Data
      summary: List email template IDs and names
      description: "Returns workspace email template IDs and names. Use an id with\
        \ GET /public/action/emailTemplates/{templateId} to retrieve raw content.\
        \ The legacy /emailTemplates/list endpoint continues to return names only."
      operationId: listEmailTemplateDetails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiEmailTemplateSummary"
  /public/action/emailTemplates/{templateId}:
    get:
      tags:
      - Workspace & Reference Data
      summary: Get raw email template content
      description: "Returns the template id, name, subject, and htmlContent from the\
        \ API key's workspace. Tokens are returned unchanged; this endpoint does not\
        \ render tokens or send email."
      operationId: getEmailTemplate
      parameters:
      - name: templateId
        in: path
        description: Template id returned by GET /public/action/emailTemplates
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEmailTemplate"
        "404":
          description: Template not found in the API key's workspace
  /public/action/emailTemplates/list:
    get:
      tags:
      - Workspace & Reference Data
      summary: List email templates
      operationId: getEmailTemplates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /public/action/contacts/search:
    get:
      tags:
      - Contacts
      summary: Search contacts
      description: "Term is matched (contains, case-insensitive) against email, first\
        \ name and last name. Pass id for an exact single-record lookup. Omit both\
        \ to list all active contacts."
      operationId: searchContacts
      parameters:
      - name: query
        in: query
        description: "Term matched against email, first and last name (contains)"
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact contact id; overrides query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
  /public/action/clients/search:
    get:
      tags:
      - Clients
      summary: Search clients
      description: "Case-insensitive matching: client name and phone (starts-with),\
        \ contact email and phone (starts-with), contact full name (contains). Pass\
        \ id for an exact single-record lookup."
      operationId: searchClients_1
      parameters:
      - name: query
        in: query
        description: Free-text term; see operation description for matched fields
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact client id; overrides query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /public/action/clients/list:
    get:
      tags:
      - Clients
      summary: List clients
      description: Lists all active clients in the workspace.
      operationId: getClientList
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /public/action/agreements/search:
    get:
      tags:
      - Agreements
      summary: Search agreements
      description: "Read-only. Lists agreements, optionally filtered by clientId.\
        \ Pass id for an exact single-record lookup."
      operationId: searchAgreements
      parameters:
      - name: clientId
        in: query
        description: Only agreements belonging to this client id
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: Exact agreement id; overrides clientId
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgreementMini"
  /public/action/account/{accountId}:
    get:
      tags:
      - Workspace & Reference Data
      summary: Get account (supplier) info
      description: "Returns the workspace identity (name, address, taxId, tax label,\
        \ currency) for the given accountId. The accountId must match the API key's\
        \ workspace. No bank details or payment-processor ids are returned."
      operationId: getAccountInfo
      parameters:
      - name: accountId
        in: path
        description: Workspace account id; must match the API key's workspace
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "403":
          description: The accountId does not match the API key's workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetails"
  /public/action/calendar/{id}:
    delete:
      tags:
      - Calendar
      summary: Delete calendar event
      operationId: deleteCalendarEvent
      parameters:
      - name: id
        in: path
        description: The eventId of the calendar event to delete
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
